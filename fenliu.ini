[custom]
; ==========================================================
; 精简版：国内直连 / 国外 Default，只留真正要单独控的组
; 保留：ChatGPT、Claude、国外 AI、Telegram、Discord、Steam、Adobe、节点1-5、Default
; 不按国家分组（自定义节点名对不上 HK/TW/US）
; 节点1-5 均为全节点选择槽，在面板里各自指定实际节点
; 默认：各应用优先 节点1
; OpenClash 请同时开启「绕过中国大陆」（国内 IP）
;
; 【防 DNS 泄漏 · 必须在 OpenClash 里开，ini 规则拦不住系统 DNS】
; 1. DNS 设置：启用 + 劫持本地 DNS（53）+ 防止 DNS 泄漏
; 2. 运行模式：Fake-IP（推荐）或 Redir-Host + 开启 DNS 劫持
; 3. 关闭系统 IPv6，或 OpenClash 同时劫持 IPv6 DNS（AAAA 最容易漏）
; 4. 使用 TUN / 增强模式，进程规则才生效（Telegram.exe / Discord.exe）
; 5. 不要把 8.8.8.8 / 1.1.1.1 填进「绕过」名单
; Telegram / Discord 用不同节点 = 分流，不是 DNS 泄漏
; 泄漏只发生在：查询没进 Clash（没劫持 53 / 开了 IPv6 / 绕过了 1.1.1.1）
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 节点清洗：剔除机场展示/说明/防失联/流量提示节点
; ==========================================================
exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Expire|Official|Website


; ==========================================================
; 1) 规则（自上而下优先级）
; ==========================================================
; Adobe 排最上。若开了绕过大陆，国内能访问的 adobe 仍会直连，
; 需在【流量控制】→【绕过指定区域 IPv4 黑名单】加：
; adobe.com / adobelogin.com / adobe.io / behance.net
ruleset=🟥 Adobe,[]GEOSITE,adobe
ruleset=🟥 Adobe,[]GEOIP,adobe,no-resolve

; --- 私网 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- Telegram 进程（不走 DNS，必须在 GEOIP,cn 之前，需 TUN）---
ruleset=📨 Telegram,[]PROCESS-NAME,Telegram.exe
ruleset=📨 Telegram,[]PROCESS-NAME,Telegram
ruleset=📨 Telegram,[]PROCESS-NAME,telegram-desktop
ruleset=📨 Telegram,[]PROCESS-NAME,org.telegram.messenger
ruleset=📨 Telegram,[]PROCESS-NAME,org.telegram.messenger.web
ruleset=📨 Telegram,[]PROCESS-NAME,org.telegram.messenger.beta
ruleset=📨 Telegram,[]PROCESS-NAME,org.telegram.plus
ruleset=📨 Telegram,[]PROCESS-NAME,tw.nekomimi.nekogram
ruleset=📨 Telegram,[]PROCESS-NAME,org.thunderdog.challegram
ruleset=📨 Telegram,[]PROCESS-NAME,org.telegram.messenger.webapp

; --- Discord 进程（语音 UDP 不走域名，必须 TUN，排在 GEOIP,cn 之前）---
ruleset=💬 Discord,[]PROCESS-NAME,Discord.exe
ruleset=💬 Discord,[]PROCESS-NAME,Discord
ruleset=💬 Discord,[]PROCESS-NAME,DiscordPTB.exe
ruleset=💬 Discord,[]PROCESS-NAME,DiscordCanary.exe
ruleset=💬 Discord,[]PROCESS-NAME,com.discord
ruleset=💬 Discord,[]PROCESS-NAME,com.discord.mobile

